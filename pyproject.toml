[tool.poetry]
name = "gcloud-common-utils"
version = "0.5.1"  # Bumped for metadata feature
description = "Common utilities to interact with gcloud, focused on google storage and google pubsub"
authors = ["Cloud <cloud@eniva.no>"]
readme = "README.md"
packages = [{include = "gcloud_common_utils", from = "src"}]

[tool.poetry.dependencies]
python = "^3.10"
google-auth = ">=2.57.0"
google-cloud-storage = ">=3.13.0"
google-cloud-pubsub = ">=2.39.0"
typeguard = ">=2.6.0,<3.0.0"
nivacloud-logging = ">=1.0.0"

[tool.poetry.group.dev.dependencies]
pytest = "^9.0.3"

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"
